name: pages

on:
  push:
    branches: [main]
    paths: ["docs/devlog/**", "docs/assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The devlog page is authored without a document skeleton (it is also published as a
      # claude.ai artifact, which adds one). Wrap it here so Pages serves a standards-mode page.
      - name: Build site
        run: |
          mkdir -p _site/assets
          cp docs/assets/*.svg _site/assets/
          {
            printf '%s\n' '<!doctype html>' '<html lang="zh-Hant">' '<head>' \
              '<meta charset="utf-8">' \
              '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' \
              '<link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">' \
              '<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>' \
              '</head>' '<body>'
            cat docs/devlog/microduck-devlog.html
            printf '%s\n' '</body>' '</html>'
          } > _site/index.html
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
