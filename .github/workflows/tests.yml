name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The suite needs no robot and no third-party packages: it talks to a fake robotd over
      # socket pairs. Tests that need OpenCV or sherpa-onnx skip themselves when those are absent.
      - name: Offline tests
        run: python -m unittest discover -s follow/tests -t .
