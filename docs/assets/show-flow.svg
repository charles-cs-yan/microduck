<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" width="980" height="250">
  <title>Show flow: idle, straight, idle, dance, home, straight, idle</title>
  <style>
    .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
    .sans { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    .act { fill: #93a0bd; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
    .rule { stroke: #263355; stroke-width: 2; stroke-linecap: round; }
    .node-t { font-size: 16px; font-weight: 700; }
    .cap { fill: #93a0bd; font-size: 12.5px; }
    .chip-t { font-size: 13px; font-weight: 600; }
    .arrow { stroke: #93a0bd; stroke-linecap: round; stroke-width: 2; fill: none; }
    .tick { stroke: #263355; stroke-width: 1.5; }
    .flow { stroke: #ffd23f; stroke-width: 2; stroke-dasharray: 4 8; fill: none; opacity: .55; animation: run 1s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M3 2 L10 6 L3 10" fill="none" stroke="#93a0bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="980" height="250" rx="20" fill="#0b1020"/>

  <!-- acts: a label and a rule over the states that belong to each -->
  <g class="mono">
    <text class="act" x="18" y="34">ACT 1 · ON STAGE</text>
    <line class="rule" x1="18" y1="46" x2="402" y2="46"/>
    <text class="act" x="438" y="34">ACT 2 · PARTY</text>
    <line class="rule" x1="438" y1="46" x2="542" y2="46"/>
    <text class="act" x="578" y="34">ACT 3 · OFF STAGE</text>
    <line class="rule" x1="578" y1="46" x2="962" y2="46"/>
  </g>

  <g class="arrow" marker-end="url(#head)">
    <path d="M122 132 H154"/><path d="M262 132 H294"/><path d="M402 132 H434"/>
    <path d="M542 132 H574"/><path d="M682 132 H714"/><path d="M822 132 H854"/>
  </g>

  <!-- triggers, one per arrow: yellow = voice, dashed grey = automatic -->
  <g class="mono">
    <rect x="92" y="76" width="92" height="28" rx="14" fill="#0b1020" stroke="#ffd23f" stroke-width="1.5"/>
    <text class="chip-t" x="138" y="95" text-anchor="middle" fill="#ffd23f">Let's go</text>

    <rect x="224" y="76" width="108" height="28" rx="14" fill="#0b1020" stroke="#93a0bd" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text class="chip-t" x="278" y="95" text-anchor="middle" fill="#93a0bd">2 m walked</text>

    <rect x="360" y="76" width="116" height="28" rx="14" fill="#0b1020" stroke="#ffd23f" stroke-width="1.5"/>
    <text class="chip-t" x="418" y="95" text-anchor="middle" fill="#ffd23f">Let's party</text>

    <rect x="496" y="76" width="124" height="28" rx="14" fill="#0b1020" stroke="#ffd23f" stroke-width="1.5"/>
    <text class="chip-t" x="558" y="95" text-anchor="middle" fill="#ffd23f">Let's go home</text>

    <rect x="644" y="76" width="108" height="28" rx="14" fill="#0b1020" stroke="#93a0bd" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text class="chip-t" x="698" y="95" text-anchor="middle" fill="#93a0bd">turned 180°</text>

    <rect x="784" y="76" width="108" height="28" rx="14" fill="#0b1020" stroke="#93a0bd" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text class="chip-t" x="838" y="95" text-anchor="middle" fill="#93a0bd">2 m walked</text>
  </g>

  <!-- states -->
  <g class="sans">
    <rect x="18" y="112" width="104" height="40" rx="20" fill="#18223d" stroke="#5d6a88" stroke-width="1.5"/>
    <text class="node-t" x="70" y="138" text-anchor="middle" fill="#e8ecf6">idle</text>
    <text class="cap" x="70" y="176" text-anchor="middle">standing by</text>

    <rect x="158" y="112" width="104" height="40" rx="20" fill="#58d6e6"/>
    <text class="node-t" x="210" y="138" text-anchor="middle" fill="#0b1020">straight</text>
    <text class="cap" x="210" y="176" text-anchor="middle">walks 2 m on stage</text>

    <rect x="298" y="112" width="104" height="40" rx="20" fill="#18223d" stroke="#5d6a88" stroke-width="1.5"/>
    <text class="node-t" x="350" y="138" text-anchor="middle" fill="#e8ecf6">idle</text>
    <text class="cap" x="350" y="176" text-anchor="middle">on stage</text>

    <rect x="438" y="112" width="104" height="40" rx="20" fill="#ffd23f"/>
    <text class="node-t" x="490" y="138" text-anchor="middle" fill="#1a1400">dance</text>
    <text class="cap" x="490" y="176" text-anchor="middle">on the spot, ≤ 30 s</text>

    <rect x="578" y="112" width="104" height="40" rx="20" fill="#ff8a3d"/>
    <text class="node-t" x="630" y="138" text-anchor="middle" fill="#1a1400">home</text>
    <text class="cap" x="630" y="176" text-anchor="middle">turns around</text>

    <rect x="718" y="112" width="104" height="40" rx="20" fill="#58d6e6"/>
    <text class="node-t" x="770" y="138" text-anchor="middle" fill="#0b1020">straight</text>
    <text class="cap" x="770" y="176" text-anchor="middle">walks 2 m back</text>

    <rect x="858" y="112" width="104" height="40" rx="20" fill="#18223d" stroke="#5d6a88" stroke-width="1.5"/>
    <text class="node-t" x="910" y="138" text-anchor="middle" fill="#e8ecf6">idle</text>
    <text class="cap" x="910" y="176" text-anchor="middle">off stage</text>
  </g>

  <!-- legend -->
  <line x1="18" y1="200" x2="962" y2="200" stroke="#18223d" stroke-width="1.5"/>
  <g class="mono" font-size="12">
    <rect x="18" y="215" width="14" height="14" rx="7" fill="none" stroke="#ffd23f" stroke-width="1.5"/>
    <text x="40" y="226" fill="#93a0bd">voice</text>
    <rect x="98" y="215" width="14" height="14" rx="7" fill="none" stroke="#93a0bd" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="120" y="226" fill="#93a0bd">automatic</text>
    <text x="962" y="226" text-anchor="end" fill="#5d6a88">keys f, d, h back up the voice; s or Enter stops from any state</text>
  </g>
</svg>
