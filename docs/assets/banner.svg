<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 330" width="960" height="330">
  <title>Microduck: walk on, dance, go home</title>
  <style>
    .panel { fill: #121a30; stroke: #263355; stroke-width: 1.5; }
    .act { fill: #ffd23f; font: 700 15px ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .08em; }
    .say { fill: #e8ecf6; font: 600 17px "Segoe UI", system-ui, -apple-system, sans-serif; }
    .sub { fill: #93a0bd; font: 13px "Segoe UI", system-ui, -apple-system, sans-serif; }
    .note { fill: #58d6e6; font: 700 22px "Segoe UI Symbol", "Segoe UI", sans-serif; }
    .sight { stroke: #58d6e6; stroke-width: 2.5; stroke-dasharray: 6 7; fill: none; animation: dash 1.1s linear infinite; }
    .walk { animation: walk 2.4s ease-in-out infinite; }
    .bob { animation: bob .6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .dance { animation: sway 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .n1 { animation: rise 2s ease-out infinite; } .n2 { animation: rise 2s ease-out .7s infinite; } .n3 { animation: rise 2s ease-out 1.3s infinite; }
    .home { animation: home 3s ease-in-out infinite; }
    @keyframes dash { to { stroke-dashoffset: -26; } }
    @keyframes walk { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(14px); } }
    @keyframes bob { 50% { transform: translateY(-4px); } }
    @keyframes sway { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-46px); opacity: 0; } }
    @keyframes home { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-18px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <symbol id="duck" viewBox="56 28 152 158">
      <ellipse cx="122" cy="178" rx="50" ry="5" fill="#263355"/>
      <rect x="105" y="150" width="7" height="22" rx="3.5" fill="#ff8a3d"/>
      <ellipse cx="113" cy="174" rx="12" ry="5" fill="#ff8a3d"/>
      <rect x="129" y="150" width="7" height="22" rx="3.5" fill="#ff8a3d"/>
      <ellipse cx="137" cy="174" rx="12" ry="5" fill="#ff8a3d"/>
      <path d="M76 122 Q60 108 66 92 Q78 104 88 110 Z" fill="#ffd23f"/>
      <ellipse cx="118" cy="132" rx="46" ry="32" fill="#ffd23f"/>
      <ellipse cx="128" cy="142" rx="28" ry="17" fill="#ffe68a"/>
      <ellipse cx="106" cy="130" rx="21" ry="13" transform="rotate(-14 106 130)" fill="#f0b400"/>
      <circle cx="154" cy="84" r="34" fill="#ffd23f"/>
      <path d="M148 52 Q140 38 150 32 Q150 42 156 46 Q158 34 170 34 Q160 42 162 52 Z" fill="#ffd23f"/>
      <path d="M182 80 Q200 80 204 88 Q194 94 182 92 Z" fill="#ff8a3d"/>
      <path d="M182 93 Q196 94 199 98 Q190 102 182 99 Z" fill="#ff8a3d" opacity=".85"/>
      <ellipse cx="164" cy="98" rx="8" ry="5" fill="#ff8fa3" opacity=".75"/>
      <ellipse cx="166" cy="78" rx="5.5" ry="7" fill="#1a1400"/>
      <circle cx="168" cy="75" r="2.2" fill="#fff"/>
      <circle cx="164.5" cy="82" r="1" fill="#fff"/>
    </symbol>
  </defs>

  <rect width="960" height="330" rx="22" fill="#0b1020"/>

  <!-- Act 1: follow -->
  <rect class="panel" x="20" y="20" width="290" height="220" rx="16"/>
  <path class="sight" d="M190 214 H266"/>
  <path d="M258 207 L267 214 L258 221" fill="none" stroke="#58d6e6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="sub" x="226" y="236" text-anchor="middle" fill="#58d6e6" style="fill:#58d6e6;font-weight:700">2 m</text>
  <line x1="282" y1="118" x2="282" y2="216" stroke="#e8ecf6" stroke-width="3" stroke-linecap="round"/>
  <path d="M283 120 L302 129 L283 138 Z" fill="#ff8a3d"/>
  <g class="walk">
    <g class="bob"><use href="#duck" xlink:href="#duck" x="44" y="76" width="140" height="146"/></g>
  </g>
  <text class="act" x="34" y="272">ACT 1 · ON STAGE</text>
  <text class="say" x="34" y="296">"Let's go!"</text>
  <text class="sub" x="34" y="316">walks straight 2 m on stage</text>

  <!-- Act 2: dance -->
  <rect class="panel" x="335" y="20" width="290" height="220" rx="16"/>
  <text class="note n1" x="402" y="96">♪</text>
  <text class="note n2" x="560" y="86">♫</text>
  <text class="note n3" x="586" y="132">♪</text>
  <g class="dance"><use href="#duck" xlink:href="#duck" x="410" y="76" width="140" height="146"/></g>
  <text class="act" x="349" y="272">ACT 2 · DANCE</text>
  <text class="say" x="349" y="296">"Let's party!"</text>
  <text class="sub" x="349" y="316">sway, nod, chatter, up to 30 s</text>

  <!-- Act 3: go home -->
  <rect class="panel" x="650" y="20" width="290" height="220" rx="16"/>
  <g transform="translate(676 104)">
    <path d="M0 26 L26 4 L52 26 Z" fill="#ff8a3d"/>
    <rect x="7" y="25" width="38" height="32" rx="3" fill="#e8ecf6"/>
    <rect x="21" y="37" width="11" height="20" rx="2" fill="#0b1020"/>
  </g>
  <g class="home">
    <path class="sight" d="M790 150 L742 144"/>
    <g transform="translate(1720 0) scale(-1 1)">
      <g class="bob"><use href="#duck" xlink:href="#duck" x="776" y="76" width="140" height="146"/></g>
    </g>
  </g>
  <text class="act" x="664" y="272">ACT 3 · GO HOME</text>
  <text class="say" x="664" y="296">"Let's go home"</text>
  <text class="sub" x="664" y="316">turns 180° and walks 2 m back</text>
</svg>
